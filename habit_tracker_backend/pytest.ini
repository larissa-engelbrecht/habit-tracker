[pytest]
DJANGO_SETTINGS_MODULE = habit_tracker_backend.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=habits
    --cov-report=term-missing
    --cov-report=html
testpaths = habits/tests